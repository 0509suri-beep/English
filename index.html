<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 1 英语闯关课堂</title>
<style>
:root{--bg:#f5f7ff;--card:#fff;--text:#26344a;--muted:#78859a;--blue:#6d8cff;--green:#55c99a;--yellow:#ffd86b;--pink:#ff9db5;--line:#e6eaf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}.logo{font-size:21px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin:7px 0 25px}.nav button{width:100%;text-align:left;background:none;padding:12px;border-radius:12px;color:#63718a;margin:4px 0}.nav button.active{background:#edf1ff;color:#5272e9;font-weight:700}.main{flex:1;min-width:0;padding:28px;max-width:1400px;margin:auto}h1{margin:0;font-size:28px}h2{margin:0 0 15px;font-size:21px}h3{margin:0 0 8px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 8px 25px #34456d0c;min-width:0}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.btn{background:#eef2f8;color:#43536c;padding:10px 14px;border-radius:11px;font-weight:700}.primary{background:var(--blue);color:#fff}.green{background:#e3f8ef;color:#248a61}.pink{background:#fff0f4;color:#c85c79}.yellow{background:#fff5d8;color:#8b6b17}.actions{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:40px;font-weight:800}.bar{height:10px;background:#edf0f6;border-radius:20px;overflow:hidden}.bar div{height:100%;background:var(--blue)}.mission{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;margin:9px 0}.mission b{background:#edf1ff;color:#5874df;border-radius:10px;padding:9px}.mission .right{margin-left:auto;color:var(--muted);font-size:13px}.word{font-size:46px;font-weight:850;text-align:center;margin:18px 0 5px}.phonetic{text-align:center;color:#6477ce;font-size:21px}.meaning{text-align:center;font-size:20px;margin:10px 0 20px}.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.wordbtn{background:#fff;border:1px solid var(--line);padding:12px;border-radius:12px;text-align:left}.wordbtn.done{background:#e9faf2;border-color:#9bdfc2}.game-title{font-size:26px;text-align:center;font-weight:800;margin:20px}.question{font-size:30px;text-align:center;font-weight:800;padding:24px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{background:#fff;border:2px solid var(--line);padding:15px;border-radius:14px;text-align:center}.opt:hover{border-color:var(--blue)}.feedback{text-align:center;font-weight:700;padding:15px}.badge{display:inline-block;padding:7px 11px;border-radius:99px;background:#edf1ff;color:#5572df;font-size:13px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--text)}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:13px}.story{font-size:20px;line-height:2}.line{padding:5px 10px;border-radius:8px}.line.active{background:#fff1bf}.hidden{display:none}@media(max-width:850px){.side{width:190px}.s8,.s6,.s4{grid-column:span 12}.main{padding:17px}}@media(max-width:560px){.app{display:block}.side{position:static;width:100%;height:auto}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto}.main{padding:12px}h1{font-size:23px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo">🎮 英语闯关课堂</div><div class="sub">四年级 · Unit 1 · 90分钟</div><nav class="nav">
<button class="active" data-p="home">课堂首页</button><button data-p="timer">课堂计时</button><button data-p="words">单词宝藏</button><button data-p="games">游戏闯关</button><button data-p="phonics">音标训练</button><button data-p="reading">课文朗读</button><button data-p="record">课堂记录</button><button data-p="homework">作业</button>
</nav></aside><main class="main" id="app"></main></div>
<script>
const W=[["sport","体育运动","/spɔːt/"],["jump","跳","/dʒʌmp/"],["high","高高地","/haɪ/"],["far","远","/fɑː/"],["ping-pong","乒乓球运动","/ˈpɪŋ pɒŋ/"],["volleyball","排球运动","/ˈvɒlibɔːl/"],["across","穿过","/əˈkrɒs/"],["hope","希望","/həʊp/"],["lose","失去","/luːz/"],["because","因为","/bɪˈkɒz/"],["other","其他的","/ˈʌðə/"],["money","钱","/ˈmʌni/"],["hard","困难的","/hɑːd/"],["kind","善良的","/kaɪnd/"],["keep","持续","/kiːp/"],["month","月","/mʌnθ/"],["ill","生病的","/ɪl/"],["anymore","再","/ˌeniˈmɔː/"],["year","年","/jɪə/"],["remember","记住","/rɪˈmembə/"],["fail","失败","/feɪl/"],["give up","放弃",""],["never","绝不","/ˈnevə/"],["try","尝试","/traɪ/"],["try your best","尽最大努力",""],["star","明星","/stɑː/"],["ability","能力","/əˈbɪləti/"],["player","运动员","/ˈpleɪə/"]].map((x,i)=>({id:i,w:x[0],m:x[1],p:x[2],done:false}));
let s=JSON.parse(localStorage.getItem("u1game")||"null")||{words:W,stage:0,elapsed:0,coins:0,stars:0,game:0,qi:0,answer:null,score:0,text:"",line:0,notes:"",homework:"朗读课文2遍；复习今天的单词；默写 sport、jump、hope、because、try。"};
const stages=[["开场热身",10],["音标训练",20],["单词宝藏",25],["游戏闯关",15],["课文朗读",15],["复习作业",5]];
let interval=null;
const $=x=>document.getElementById(x);function save(){localStorage.setItem("u1game",JSON.stringify(s))}
function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.78;speechSynthesis.speak(u)}}
function top(t,d){return `<div class="top"><div><h1>${t}</h1><div class="muted">${d}</div></div><span class="badge">⭐ ${s.stars} 星星　🪙 ${s.coins} 金币</span></div>`}
function home(){return top("Unit 1 英语闯关课堂","把“不爱张嘴”变成“完成任务就能升级”")+
`<div class="grid"><div class="card s8"><h2>今日任务</h2><div class="big">${fmt(5400-s.elapsed)}</div><div class="muted">课堂剩余时间</div><div class="bar" style="margin:15px 0"><div style="width:${s.elapsed/54}%"></div></div><div class="actions"><button class="btn primary" onclick="go('timer')">开始上课</button><button class="btn green" onclick="go('games')">进入游戏</button></div></div><div class="card s4"><h2>成长值</h2><div class="big">⭐ ${s.stars}</div><p>每读对一个单词：+1星</p><p>完成一个游戏：+3星</p><p>主动开口：额外奖励</p></div><div class="card s12"><h2>今天的闯关地图</h2>${stages.map((x,i)=>`<div class="mission"><b>${i+1}</b><div><strong>${x[0]}</strong><div class="muted">${x[1]}分钟 · ${["先聊一聊，再热身","嘴型＋声音模仿","单词卡＋宝藏收集","骰子、抢答、配对","逐句跟读＋角色朗读","复习＋带走作业"][i]}</div></div><span class="right">${i<s.stage?"已完成":i===s.stage?"进行中":"待解锁"}</span></div>`).join("")}</div></div>`}
function timer(){return top("课堂计时","教师控制课堂节奏，孩子完成任务获得星星")+
`<div class="grid"><div class="card s6"><h2>总计时</h2><div class="big" id="clock">${fmt(5400-s.elapsed)}</div><div class="bar"><div id="bar" style="width:${s.elapsed/54}%"></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="toggleTimer()">${interval?"暂停":"开始"}</button><button class="btn" onclick="resetTimer()">重置</button></div></div><div class="card s6"><h2>当前任务</h2><h3>${stages[s.stage][0]}</h3><div class="big">${stages[s.stage][1]}分钟</div><div class="actions"><button class="btn" onclick="s.stage=Math.max(0,s.stage-1);save();go('timer')">上一个</button><button class="btn primary" onclick="s.stage=Math.min(5,s.stage+1);save();go('timer')">完成并下一关</button></div></div><div class="card s12"><h2>课堂环节</h2>${stages.map((x,i)=>`<div class="mission"><b>${i+1}</b><strong>${x[0]}</strong><span class="right">${x[1]}分钟</span></div>`).join("")}</div></div>`}
function words(){let w=s.words[s.qi%s.words.length];return top("单词宝藏","每读一个单词，就能收集一枚宝藏")+
`<div class="grid"><div class="card s6"><span class="badge">${w.done?"已掌握":"待收集"}</span><div class="word">${w.w}</div><div class="phonetic">${w.p||"可补充音标"}</div><div class="meaning">${w.m}</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="speak('${w.w}')">🔊 听一听</button><button class="btn green" onclick="s.stars++;s.coins++;s.words[s.qi%s.words.length].done=true;save();go('words')">我读出来了 +星星</button></div><div class="actions" style="justify-content:center;margin-top:10px"><button class="btn" onclick="s.qi=Math.max(0,s.qi-1);save();go('words')">上一个</button><button class="btn" onclick="s.qi++;save();go('words')">下一个</button></div></div><div class="card s6"><h2>宝藏地图</h2><div class="wordgrid">${s.words.map((x,i)=>`<button class="wordbtn ${x.done?"done":""}" onclick="s.qi=${i};save();go('words')"><b>${x.w}</b><div class="muted">${x.m}</div></button>`).join("")}</div></div></div>`}
function games(){let w=s.words[s.game%s.words.length];let type=s.mode||"英译中";let q=type==="英译中"?w.w:type==="中译英"?w.m:mask(w.w);let correct=type==="英译中"?w.m:w.w;let opts=[correct];while(opts.length<4){let x=s.words[Math.floor(Math.random()*s.words.length)];let v=type==="英译中"?x.m:x.w;if(!opts.includes(v))opts.push(v)}opts.sort(()=>Math.random()-.5);return top("游戏闯关","不要求孩子一直坐着背单词，让她通过任务开口")+
`<div class="card"><div class="actions"><select onchange="s.mode=this.value;newGame()"><option>英译中</option><option>中译英</option><option>补全单词</option></select><button class="btn yellow" onclick="newGame()">换一题</button></div><div class="game-title">🎲 ${["单词抢答站","宝藏配对赛","勇者拼写关","小老师挑战"][s.game%4]}</div><div class="question">${q}</div><div class="opts">${opts.map(o=>`<button class="opt" onclick="answer('${o.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}')">${o}</button>`).join("")}</div>${s.answer?`<div class="feedback">${s.answer==="ok"?"🎉 回答正确！+3星星":"再试一次。正确答案是："+correct}</div>`:""}<div class="actions" style="justify-content:center;margin-top:18px"><button class="btn green" onclick="speak('${w.w}')">先听发音</button><button class="btn primary" onclick="speak('${w.w}');s.stars++;save();newGame()">我开口读了 +1星</button></div></div>`}
function mask(x){return x.length<3?x:x[0]+"_".repeat(Math.max(1,x.length-2))+x[x.length-1]}
function newGame(){s.game=Math.floor(Math.random()*s.words.length);s.answer=null;save();go("games")}
function answer(a,c){s.answer=a===c?"ok":"bad";if(a===c)s.stars+=3;save();go("games")}
function phonics(){return top("音标训练","教师示范 → 学生模仿 → 结合单词开口")+
`<div class="grid"><div class="card s6"><h2>今日音标任务</h2>${[["/p/","sport、ping-pong"],["/dʒ/","jump"],["/aɪ/","high、try"],["/əʊ/","hope"],["/ɑː/","far、star"]].map(x=>`<div class="mission"><div><h3>${x[0]}</h3><div class="muted">${x[1]}</div></div><button class="btn small" onclick="speak('${x[1].split('、')[0]}')">示范</button></div>`).join("")}</div><div class="card s6"><h2>发音小游戏：回声小达人</h2><p>你读一次，孩子像回声一样读一次。</p><p>每完成3次跟读，奖励1颗星。</p><button class="btn primary" onclick="s.stars++;save();alert('获得1颗星！')">完成一次跟读</button><div class="notice">不要连续纠错。先夸她开口，再只纠正一个最明显的问题。</div></div></div>`}
function reading(){let lines=s.text.split(/\n+/).filter(Boolean);return top("课文朗读","把朗读变成角色任务：小老师、回声、配音员")+
`<div class="grid"><div class="card s6"><h2>粘贴课文</h2><textarea id="txt" placeholder="把 Unit 1 课文粘贴到这里">${s.text}</textarea><button class="btn primary" style="margin-top:10px" onclick="s.text=$('txt').value;s.line=0;save();go('reading')">保存课文</button></div><div class="card s6"><h2>逐句朗读任务</h2>${lines.length?`<div class="story">${lines.map((x,i)=>`<div class="line ${i===s.line?'active':''}">${x}</div>`).join("")}</div><div class="actions"><button class="btn" onclick="s.line=Math.max(0,s.line-1);save();go('reading')">上一句</button><button class="btn primary" onclick="speak('${lines[s.line]}')">播放</button><button class="btn" onclick="s.line=Math.min(lines.length-1,s.line+1);save();go('reading')">下一句</button><button class="btn green" onclick="s.stars++;save();alert('完成朗读，获得1颗星！')">我读完了</button></div>`:`<div class="muted">请先粘贴课文原文。</div>`}</div></div>`}
function record(){return top("课堂记录","把今天的表现留下来")+
`<div class="card"><label>学生今天的表现</label><textarea id="notes">${s.notes}</textarea><label>下节课计划</label><textarea id="plan">${s.plan||""}</textarea><button class="btn primary" onclick="s.notes=$('notes').value;s.plan=$('plan').value;save();alert('已保存')">保存记录</button></div>`}
function homework(){return top("复习与作业","下课前展示给学生或复制给家长")+
`<div class="card"><h2>今日作业</h2><textarea id="hw">${s.homework}</textarea><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="s.homework=$('hw').value;save();alert('已保存')">保存</button><button class="btn" onclick="navigator.clipboard?navigator.clipboard.writeText(s.homework):alert(s.homework)">复制作业</button></div></div>`}
function fmt(n){return String(Math.floor(Math.max(0,n)/60)).padStart(2,"0")+":"+String(Math.max(0,n)%60).padStart(2,"0")}
function toggleTimer(){if(interval){clearInterval(interval);interval=null}else{interval=setInterval(()=>{if(s.elapsed<5400)s.elapsed++;save();if($("clock")){$("clock").textContent=fmt(5400-s.elapsed);$("bar").style.width=s.elapsed/54+"%"}},1000)}go("timer")}
function resetTimer(){clearInterval(interval);interval=null;s.elapsed=0;save();go("timer")}
function go(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));$("app").innerHTML={home,timer,words,games,phonics,reading,record,homework}[p]()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));go("home");
</script></body></html>
