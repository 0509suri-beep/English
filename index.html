<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 英语家教教学工作台</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--text:#243247;--muted:#718096;
  --primary:#6b8afd;--primary-light:#edf1ff;--mint:#dff5ed;
  --yellow:#fff3cc;--border:#e5eaf2;--danger:#e87575;--shadow:0 8px 24px rgba(44,62,100,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#fff;border-right:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;line-height:1.4;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.nav button{display:block;width:100%;text-align:left;background:transparent;padding:13px 14px;border-radius:12px;margin:5px 0;color:#58677d}
.nav button.active{background:var(--primary-light);color:#526fe4;font-weight:700}
.main{flex:1;min-width:0;padding:28px;max-width:1450px;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:28px;margin:0 0 5px}
h2{font-size:21px;margin:0 0 15px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
.btn{padding:10px 15px;border-radius:10px;background:#eef2f8;color:#40516a;font-weight:600}
.btn.primary{background:var(--primary);color:white}.btn.danger{background:#fff0f0;color:#c95d5d}.btn.small{padding:7px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stat{font-size:34px;font-weight:800;margin:10px 0}
.progress{height:10px;background:#edf0f6;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--primary);width:0%;transition:width .2s}
.timeline{display:grid;gap:9px}
.stage{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px}
.stage.active{background:var(--primary-light);border-color:#cbd5ff}
.stage .time{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
input,textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff;color:var(--text)}
textarea{min-height:120px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px}
.word-card{text-align:center;padding:28px;background:linear-gradient(135deg,#f6f8ff,#fff)}
.word{font-size:42px;font-weight:800;margin:12px 0}
.phonetic{font-size:21px;color:#6075c9}
.meaning{font-size:19px;margin:10px 0 20px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.pill{padding:7px 11px;border-radius:99px;background:#f0f3f8;color:#66758a;font-size:13px}
.pill.active{background:var(--primary);color:#fff}
.word-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word-item{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;text-align:left}
.word-item.mastered{background:#effaf5;border-color:#bce8d4}
.word-item strong{display:block;font-size:17px;margin-bottom:4px}
.exercise-question{font-size:28px;font-weight:800;text-align:center;padding:30px 10px}
.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:left}
.option.correct{background:#e6f8ee;border-color:#80d2a5}.option.wrong{background:#fff0f0;border-color:#e9a0a0}
.lesson-text{font-size:20px;line-height:2;white-space:pre-wrap}
.lesson-line{padding:6px 10px;border-radius:8px}.lesson-line.active{background:#fff3cc}
.notice{padding:12px 14px;border-radius:12px;background:#fff8df;color:#866b20;margin:12px 0}
.hidden{display:none!important}
.small{font-size:13px}
.footer-note{margin-top:24px;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:900px){
 .sidebar{width:190px;padding:18px 10px}.main{padding:18px}.span-8,.span-6,.span-4{grid-column:span 12}
}
@media(max-width:600px){
 .app{display:block}.sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border)}
 .nav{display:flex;overflow:auto;gap:6px}.nav button{white-space:nowrap;width:auto;margin:0}
 h1{font-size:23px}.word{font-size:34px}.option-grid{grid-template-columns:1fr}
}

.game-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.game-tile{padding:18px;border:1px solid var(--border);border-radius:14px;background:#fff;text-align:center}.game-tile strong{display:block;font-size:28px;margin:8px}.reward{font-size:42px;font-weight:800;color:#d39b28}.meter{height:14px;background:#f0f1f5;border-radius:99px;overflow:hidden}.meter>div{height:100%;background:#f5c451}.flash{animation:flash .35s}@keyframes flash{50%{transform:scale(1.03)}}
@media(max-width:600px){.game-board{grid-template-columns:1fr}}

.phonics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.sound-card{border:1px solid var(--border);border-radius:16px;padding:16px;background:#fff;text-align:center;transition:.2s}.sound-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.sound-symbol{font-size:30px;font-weight:800;color:#526fe4}.sound-example{font-weight:700;margin:8px 0}.sound-tip{font-size:12px;color:var(--muted);min-height:32px}.sound-card.vowel{background:linear-gradient(135deg,#fff8e7,#fff)}.sound-card.consonant{background:linear-gradient(135deg,#edf8ff,#fff)}.challenge{background:linear-gradient(135deg,#fff0f7,#f3f0ff);border:1px solid #eadcf7;border-radius:16px;padding:18px}.big-sound{font-size:56px;font-weight:900;text-align:center;color:#7956c7;margin:12px}.choice-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choice-row button{min-width:90px}.badge-mini{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0f3ff;color:#526fe4;font-size:12px}@media(max-width:600px){.phonics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

  <div class="logo">📘 英语家教工作台</div>

  <nav class="nav">

function header(title,desc){return `<div class="topbar"><div><h1>${title}</h1><div class="muted">${desc}</div></div><div class="actions"><button class="btn" onclick="resetAll()">重置本地数据</button></div></div>`}

`<div class="grid">

<div class="card span-4"><h2>今日目标</h2><p>✓ 认识基础音标</p><p>✓ 读写 Unit 1 重点单词</p><p>✓ 跟读并朗读课文</p><p>✓ 完成复习和作业布置</p></div>
<div class="card span-12"><h2>教学环节</h2><div class="timeline">${stages.map((s,i)=>`<div class="stage ${i===state.stage?'active':''}"><b>${i+1}</b><div><strong>${s[0]}</strong><div class="muted small">${s[1]}分钟</div></div><div class="time">${i===state.stage?'当前环节':'待进行'}</div></div>`).join("")}</div></div>
</div>`}
function timerPage(){return header("课堂计时","按照90分钟课程安排进行教学")+
`<div class="grid"><div class="card span-6"><h2>总计时</h2><div class="stat" id="totalClock">${fmt(90*60-state.elapsed)}</div><div class="progress"><div id="totalProgress" style="width:${state.elapsed/5400*100}%"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" id="startBtn">${state.running?"暂停课堂":"开始课堂"}</button><button class="btn" onclick="resetTimer()">重置计时</button></div></div>
<div class="card span-6"><h2>当前环节</h2><h3 id="stageTitle">${stages[state.stage][0]}</h3><div class="stat" id="stageClock">${fmt(stageElapsedRemaining())}</div><div class="actions"><button class="btn" onclick="prevStage()">上一个</button><button class="btn primary" onclick="nextStage()">下一个</button></div></div>
<div class="card span-12"><h2>课程安排</h2><div class="timeline">${stages.map((s,i)=>`<div class="stage ${i===state.stage?'active':''}"><b>${i+1}</b><div style="flex:1"><strong>${s[0]}</strong><div class="muted small">${s[1]}分钟</div></div><button class="btn small" onclick="setStage(${i})">进入</button></div>`).join("")}</div></div></div>`}

`<div class="card"><div class="pills">${["全部","运动类","基础词汇","坚持与梦想"].map(c=>`<button class="pill ${state.category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join("")}</div>

let phonicsPick=0;
function phonicsPage(){let s=phonics[phonicsPick%phonics.length];return header("音标教学实验室","48个常见英语音标 · 点击音标卡片会播放该音标对应的示范词；也可以进行拼读挑战")+
`<div class="notice">提示：浏览器语音不能准确单独合成所有 IPA 音标，所以这里播放的是包含该音的英文示范词。课堂上请以老师示范或标准音频为准。</div><div class="grid"><div class="card span-12"><div class="actions"><span class="badge-mini">${phonics.length}个音标</span><button class="btn" onclick="phonicsPick=Math.floor(Math.random()*phonics.length);renderPage('phonics')">🎲 随机抽音标</button><button class="btn primary" onclick="speakPhoneme('${s[0]}')">🔊 播放示范词</button><button class="btn" onclick="speak('${s[1].split(',')[0]}')">播放例词</button></div><div class="challenge"><div class="muted" style="text-align:center">当前挑战：看音标，读出例词</div><div class="big-sound">/${s[0]}/</div><h2 style="text-align:center">${s[1]}</h2><p style="text-align:center">${s[2]}</p><div class="choice-row"><button class="btn primary" onclick="reward(1,2);alert('完成一次音标挑战！⭐+1 🪙+2')">我读出来了＋奖励</button><button class="btn" onclick="speak('${s[1].split(',')[0]}')">听一遍</button><button class="btn" onclick="phonicsPick=(phonicsPick+1)%phonics.length;renderPage('phonics')">下一个</button></div></div></div>
<div class="card span-12"><h2>全部音标卡片</h2><div class="pills"><button class="pill active" onclick="filterPhonics('全部',this)">全部</button><button class="pill" onclick="filterPhonics('元音',this)">单元音</button><button class="pill" onclick="filterPhonics('双元音',this)">双元音</button><button class="pill" onclick="filterPhonics('辅音',this)">辅音</button></div><div class="phonics-grid" id="phonicsGrid">${phonics.map((x,i)=>`<button class="sound-card ${x[3]==='辅音'?'consonant':'vowel'}" data-kind="${x[3]}" onclick="selectPhoneme(${i})"><div class="sound-symbol">/${x[0]}/</div><div class="sound-example">${x[1]}</div><div class="sound-tip">${x[2]}</div><div class="small muted">点击卡片听示范词</div><span class="badge-mini">${x[3]}</span></button>`).join('')}</div></div>
<div class="card span-6"><h2>趣味教学玩法</h2><p>① 音标侦探：教师只展示音标，孩子找出含有这个音的单词。</p><p>② 回声挑战：教师读一次，孩子像回声一样读两次。</p><p>③ 音标拍手：听到目标音就拍手，听错不扣分。</p><p>④ 小老师：让孩子反过来给教师“上课”。</p></div><div class="card span-6"><h2>本节音标记录</h2><textarea id="phonicsNotes" placeholder="记录孩子掌握了哪些音标、哪些发音需要复习……">${state.phonicsNotes||''}</textarea><button class="btn primary" onclick="state.phonicsNotes=el('phonicsNotes').value;save();alert('已保存')">保存记录</button></div></div>`}
function filterPhonics(kind,btn){document.querySelectorAll('#phonicsGrid .sound-card').forEach(x=>x.style.display=kind==='全部'||x.dataset.kind===kind?'block':'none');document.querySelectorAll('.pills .pill').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function exercisePage(){let w=state.words[state.exerciseIndex%state.words.length];let q=state.exerciseType==="英译中"?w.word:w.meaning;
return header("单词读写练习","随机抽题，课堂上让学生口头回答或在本子上书写")+
`<div class="card"><div class="actions"><select id="exerciseType" onchange="state.exerciseType=this.value;state.exerciseAnswer=null;save();renderPage('exercise')"><option ${state.exerciseType==="英译中"?"selected":""}>英译中</option><option ${state.exerciseType==="中译英"?"selected":""}>中译英</option><option ${state.exerciseType==="补全单词"?"selected":""}>补全单词</option></select><button class="btn" onclick="newExercise()">随机抽题</button></div><div class="exercise-question">${state.exerciseType==="补全单词"?maskWord(w.word):q}</div><div class="option-grid">${exerciseOptions(w).map(o=>`<button class="option ${state.exerciseAnswer===o?'correct':''}" onclick="answerExercise('${o.replace(/'/g,"\\'")}')">${o}</button>`).join("")}</div>${state.exerciseAnswer?`<div class="notice">答案：${state.exerciseType==="英译中"?w.meaning:w.word}</div>`:""}<p class="muted small">当前得分：${state.exerciseScore}</p></div>`}
function maskWord(s){if(s.length<3)return s;let i=Math.floor(s.length/2);return s.slice(0,i)+"_"+s.slice(i+1)}
function exerciseOptions(w){let correct=state.exerciseType==="英译中"?w.meaning:w.word;let arr=[correct];while(arr.length<4){let x=state.words[Math.floor(Math.random()*state.words.length)];let v=state.exerciseType==="英译中"?x.meaning:x.word;if(!arr.includes(v))arr.push(v)}return arr.sort(()=>Math.random()-.5)}
function readingPage(){let lines=state.text.split(/\n+/).filter(Boolean);return header("课文朗读","粘贴 Unit 1 课文后，逐句带读并记录问题")+
`<div class="grid"><div class="card span-6"><h2>课文输入</h2><textarea id="lessonText" placeholder="把 Unit 1 课文粘贴到这里……">${state.text}</textarea><button class="btn primary" style="margin-top:10px" onclick="state.text=el('lessonText').value;state.readingIndex=0;save();renderPage('reading')">保存课文</button></div><div class="card span-6"><h2>逐句朗读</h2>${lines.length?`<div class="lesson-text">${lines.map((l,i)=>`<div class="lesson-line ${i===state.readingIndex?'active':''}">${l}</div>`).join("")}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="state.readingIndex=Math.max(0,state.readingIndex-1);save();renderPage('reading')">上一句</button><button class="btn primary" onclick="speak(lines[${state.readingIndex}])">播放当前句</button><button class="btn" onclick="state.readingIndex=Math.min(${lines.length-1},state.readingIndex+1);save();renderPage('reading')">下一句</button></div>`:`<div class="notice">请先在左侧粘贴课文。不要在没有原文的情况下编造课文。</div>`}</div><div class="card span-12"><h2>朗读问题记录</h2><textarea id="readingProblems" placeholder="记录孩子读错的单词、停顿和需要复习的句子……">${state.readingProblems||""}</textarea><button class="btn primary" onclick="state.readingProblems=el('readingProblems').value;save();alert('已保存')">保存记录</button></div></div>`}
function notesPage(){return header("课堂记录","记录学生表现，方便下一次备课")+
`<div class="card"><label>学生今天的表现</label><textarea id="notes">${state.notes}</textarea><label>下节课计划</label><textarea id="nextPlan">${state.nextPlan||""}</textarea><button class="btn primary" onclick="state.notes=el('notes').value;state.nextPlan=el('nextPlan').value;save();alert('已保存课堂记录')">保存课堂记录</button></div>`}
function homeworkPage(){return header("复习与作业","下课前直接展示或复制给家长")+
`<div class="card"><h2>本节课作业</h2><textarea id="homework">${state.homework}</textarea><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="state.homework=el('homework').value;save();alert('已保存作业')">保存作业</button><button class="btn" onclick="copyText(state.homework)">复制作业文本</button></div><div class="notice">建议：朗读课文2遍；复习重点单词；默写5个单词；熟读 give up、try your best、never give up。</div></div>`}

function reward(stars=1,coins=2){state.stars+=stars;state.coins+=coins;save();}
function gamesPage(){let w=state.words[state.gameIndex%state.words.length];let correct=state.gameType==="英译中"?w.meaning:w.word;let q=state.gameType==="英译中"?w.word:w.meaning;let opts=[correct];while(opts.length<4){let x=state.words[Math.floor(Math.random()*state.words.length)];let v=state.gameType==="英译中"?x.meaning:x.word;if(!opts.includes(v))opts.push(v)}opts.sort(()=>Math.random()-.5);return header("游戏闯关","让孩子在游戏中开口读、看、说、写")+`<div class="grid"><div class="card span-4"><h2>闯关数据</h2><div class="reward">⭐ ${state.stars}</div><p>金币：🪙 ${state.coins}</p><p>本轮得分：${state.gameScore}</p><button class="btn primary" onclick="newGame()">换一道题</button></div><div class="card span-8"><h2>第 ${state.gameIndex+1} 关</h2><select onchange="state.gameType=this.value;save();renderPage('games')"><option ${state.gameType==='英译中'?'selected':''}>英译中</option><option ${state.gameType==='中译英'?'selected':''}>中译英</option><option ${state.gameType==='补全单词'?'selected':''}>补全单词</option></select><div class="exercise-question">${state.gameType==='补全单词'?maskWord(w.word):q}</div><div class="option-grid">${opts.map(o=>`<button class="option" onclick="gameAnswer(this,'${o.replace(/'/g,"\'")}','${correct.replace(/'/g,"\'")}')">${o}</button>`).join('')}</div><div class="notice">答对后请让孩子大声读出单词，再点击奖励。</div></div></div>`}
function gameAnswer(btn,a,c){if(a===c){btn.classList.add('correct');state.gameScore++;reward(1,3);alert('答对啦！请孩子再读一遍，获得⭐1和🪙3');}else{btn.classList.add('wrong');alert('再试一次，先听老师示范。')}save();}
function newGame(){state.gameIndex=Math.floor(Math.random()*state.words.length);save();renderPage('games')}
function echoPage(){let w=state.words[state.gameIndex%state.words.length];return header('回声小达人','教师先示范，孩子模仿并完成一次朗读')+`<div class="card"><div class="word-card"><div class="muted">请孩子看着单词</div><div class="word">${w.word}</div><div class="phonetic">${w.phonetic||''}</div><div class="meaning">${w.meaning}</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="speak('${w.word.replace(/'/g,"\'")}')">🔊 老师示范</button><button class="btn" onclick="state.echoCount++;reward(1,2);save();renderPage('echo')">孩子读对了＋⭐1</button><button class="btn" onclick="state.gameIndex++;save();renderPage('echo')">换一个单词</button></div><p>已完成模仿：${state.echoCount} 次</p></div></div>`}
function rewardsPage(){return header('奖励中心','把努力变成看得见的成就')+`<div class="grid"><div class="card span-6"><h2>我的奖励</h2><div class="reward">⭐ ${state.stars}</div><p>金币：🪙 ${state.coins}</p><div class="meter"><div style="width:${Math.min(100,state.stars%10*10)}%"></div></div><p class="muted">每获得10颗星，可以兑换一次小奖励。</p></div><div class="card span-6"><h2>教师口头奖励</h2><p>“你今天比刚才更勇敢了。”</p><p>“你已经能自己读出来了。”</p><p>“这次发音进步很明显。”</p><button class="btn primary" onclick="reward(3,5);alert('奖励已加上：⭐3、🪙5')">表现优秀＋⭐3</button></div></div>`}


function lessonPlanPage(){return header("90分钟进阶备课教案","家教主线：音标 → 拼读 → 背单词 → 课本句型 → 朗读输出")+
`<div class="grid">
<div class="card span-12"><div class="notice"><b>本节课核心：</b>不追求讲完所有内容，而是让孩子学会用发音记单词，并能说出 Can you…? / Yes, I can. / No, I can’t.</div><div class="actions"><button class="btn primary" onclick="go('timer')">打开课堂计时</button><button class="btn" onclick="go('phonics')">进入音标教学</button><button class="btn" onclick="go('words')">进入单词教学</button><button class="btn" onclick="go('reading')">进入课文朗读</button></div></div>
<div class="card span-6"><h2>本节课目标</h2><ul><li>认识并读出 run、swim、jump、football、basketball、ping-pong、volleyball、sport。</li><li>能根据音标尝试拼读简单单词。</li><li>理解 can＝会/能，can’t＝不会/不能。</li><li>能进行 Can you…? 的简单问答。</li><li>能跟读并表演 Daming 对话。</li></ul></div>
<div class="card span-6"><h2>上课原则</h2><ul><li>每个单词都走：看图/动作 → 音标 → 拼读 → 朗读 → 造句。</li><li>孩子读错时先示范，再让孩子重读，不要直接否定。</li><li>每10分钟安排一次小任务，避免一直听讲。</li><li>奖励“主动开口、自己拼读、愿意重试”，不只奖励全对。</li></ul></div>
<div class="card span-12"><h2>课堂流程</h2><div class="timeline">
<div class="stage"><b>1</b><div><strong>0—5分钟：基础摸底</strong><div class="muted small">问姓名；测试 cat、dog、book、run、swim；观察字母、元音和拼读基础。</div><p>教师话术：今天我们要学会看发音，把单词自己读出来。</p></div></div>
<div class="stage"><b>2</b><div><strong>5—25分钟：音标与拼读</strong><div class="muted small">先复习 a、e、i、o、u，再结合 run /rʌn/、swim /swɪm/、jump /dʒʌmp/、high /haɪ/、far /fɑː/。</div><p>固定话术：看口型 → 听声音 → 跟读 → 分音 → 合音 → 放进句子。</p><p>示范：r-u-n → run → I can run.</p></div></div>
<div class="stage"><b>3</b><div><strong>25—50分钟：课本重点单词</strong><div class="muted small">动作类：run、swim、jump；球类：football、basketball、ping-pong、volleyball；补充 sport、high、far、fast、well。</div><p>每教一个词都让孩子完成：读单词＋说意思＋拼读＋造句。</p></div></div>
<div class="stage"><b>4</b><div><strong>50—60分钟：单词记忆闯关</strong><div class="muted small">中文说英文、英文读音、看音标猜词、补全单词、听写4个词。</div><p>示例：/rʌn/ → run；r_n → run；“跑步” → run。</p></div></div>
<div class="stage"><b>5</b><div><strong>60—75分钟：课本对话与句型</strong><div class="muted small">重点：Can you…? / Yes, I can. / No, I can’t. / But I can learn.</div><p>先教师示范，再替换 run、swim、play football、play ping-pong，最后角色扮演 Daming。</p></div></div>
<div class="stage"><b>6</b><div><strong>75—85分钟：综合输出</strong><div class="muted small">孩子当小老师提问；完成音标、单词、句子三关；鼓励自己纠错。</div><p>孩子至少说出：I can run. / I can swim. / Can you play ping-pong?</p></div></div>
<div class="stage"><b>7</b><div><strong>85—90分钟：复习与作业</strong><div class="muted small">读3个单词、读1个音标、回答1个问题；布置朗读和单词作业。</div></div></div>
</div></div>
<div class="card span-6"><h2>教师可直接照读的话术</h2><div class="lesson-text">Look at this word.
What does it mean?
Listen to me.
Repeat after me.
Let’s sound it out.
/r/ /ʌ/ /n/ — run.
Now you try.
Can you make a sentence?
I can run.
Great! Try it again.</div></div>
<div class="card span-6"><h2>本节课作业</h2><div class="lesson-text">1. 朗读 Unit 1 重点单词，每个3遍。
2. 抄写 run、swim、jump、football、basketball。
3. 熟读 Can you…? / Yes, I can. / No, I can’t.
4. 朗读课文5分钟。
挑战：采访家人并记录：Mum can swim. / Dad can’t swim.</div></div>
<div class="card span-12"><h2>下课记录提醒</h2><p class="muted">重点记录：孩子哪些音标不会、哪些单词需要拆音、哪些句型能独立说、下节课先复习什么。</p><button class="btn primary" onclick="go('notes')">去填写课堂记录</button></div>
</div>`}

function bindCommon(page){if(page==="timer")updateTimerUI()}
function go(page){renderPage(page)}
function setCategory(c){state.category=c;state.currentWord=0;save();renderPage("words")}
function currentFiltered(){return state.words.filter(w=>state.category==="全部"||w.category===state.category)}
function selectWord(id){let arr=currentFiltered();state.currentWord=Math.max(0,arr.findIndex(w=>w.id===id));save();renderPage("words")}
function nextWord(){state.currentWord++;save();renderPage("words")}
function prevWord(){state.currentWord=Math.max(0,state.currentWord-1);save();renderPage("words")}
function toggleMeaning(){state.showMeaning=!state.showMeaning;save();renderPage("words")}
function togglePhonetic(){state.showPhonetic=!state.showPhonetic;save();renderPage("words")}
function toggleMastered(id){let w=state.words.find(w=>w.id===id);w.mastered=!w.mastered;save();renderPage("words")}
function filterWords(v){document.querySelectorAll("#wordList .word-item").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(v.toLowerCase())?"block":"none")}
function newExercise(){state.exerciseIndex=Math.floor(Math.random()*state.words.length);state.exerciseAnswer=null;save();renderPage("exercise")}
function answerExercise(a){let w=state.words[state.exerciseIndex%state.words.length];let correct=state.exerciseType==="英译中"?w.meaning:w.word;state.exerciseAnswer=a;if(a===correct)state.exerciseScore++;save();renderPage("exercise")}
function copyText(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert("已复制")):alert(t)}
function resetTimer(){state.elapsed=0;state.stage=0;state.running=false;stopTimer();save();renderPage("timer")}
function resetAll(){if(confirm("确定清除本地记录并恢复默认内容吗？")){localStorage.removeItem("unit1_state");location.reload()}}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function startTimer(){state.running=!state.running;if(state.running){timer=setInterval(()=>{if(state.elapsed<5400){state.elapsed++;if(state.elapsed>=5400){state.elapsed=5400;state.running=false;stopTimer();alert("90分钟课堂结束");}}save();updateTimerUI()},1000)}else stopTimer();save();updateTimerUI()}
function updateTimerUI(){let total=el("totalClock"),stage=el("stageClock"),bar=el("totalProgress"),btn=el("startBtn");if(!total)return;total.textContent=fmt(5400-state.elapsed);stage.textContent=fmt(stageElapsedRemaining());bar.style.width=(state.elapsed/5400*100)+"%";btn.textContent=state.running?"暂停课堂":"开始课堂"}
function setStage(i){state.stage=i;save();renderPage("timer")}
function prevStage(){state.stage=Math.max(0,state.stage-1);save();renderPage("timer")}
function nextStage(){state.stage=Math.min(stages.length-1,state.stage+1);save();renderPage("timer")}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
document.addEventListener("click",e=>{if(e.target.id==="startBtn")startTimer()});
renderPage();
</script>
</body>
</html>
